[platformio]
default_envs = terminal_a, terminal_b
src_dir = src

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    jgromes/RadioLib
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DSLMP_BOARD_T3_V161=1

[env:terminal_a]
build_flags =
    ${env.build_flags}
    -DSLMP_DEVICE_ID=0x0001
    -DSLMP_RF_FREQUENCY_MHZ=868.0

[env:terminal_b]
build_flags =
    ${env.build_flags}
    -DSLMP_DEVICE_ID=0x0002
    -DSLMP_RF_FREQUENCY_MHZ=868.0
